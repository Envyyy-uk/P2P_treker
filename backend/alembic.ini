# Alembic — єдиний інструмент міграцій БД (жодних ручних ALTER TABLE в production)

[alembic]
script_location = migrations
prepend_sys_path = .
# DSN підставляється у migrations/env.py з конфігурації застосунку;
# значення тут — лише fallback для локальної розробки.
sqlalchemy.url = postgresql+asyncpg://arb:arb@localhost:5432/arbitrage

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
